name: Open5GS benign telemetry degradation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/publication-robustness
      - research/promote-consensus-1-8
      - research/patef-v2-provenance-normalized
    paths:
      - ".github/workflows/open5gs-benign-degradation.yml"
      - "scripts/open5gs_failover_lab.py"
      - "scripts/enrich_failover_observations.py"
      - "scripts/real_telemetry_degradation.py"
      - "scripts/aggregate_telemetry_degradation.py"
      - "src/nfnotify_lab/telemetry_degradation.py"
      - "src/nfnotify_lab/**"
      - "lab/open5gs/udm-b.yaml"

permissions:
  contents: read

jobs:
  degradation:
    name: degradation-${{ matrix.replicate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        replicate: [0, 1, 2, 3]
    env:
      OPEN5GS_VERSION: v2.7.7
      UBUNTU_VERSION: jammy
      MONGODB_VERSION: "8.0"
      DOCKER_HOST_IP: 127.0.0.1
      DOCKER_OPEN5GS_REV: 10295cfecb2f86f88944df1728127853eb4d6a1f
      LAB_REPLICATE_ID: ${{ matrix.replicate }}
      LAB_DIR: artifacts/open5gs-benign-degradation

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump tshark jq

      - name: Build Open5GS v2.7.7
        run: |
          set -euxo pipefail
          git clone https://github.com/Borjis131/docker-open5gs.git /tmp/docker-open5gs
          git -C /tmp/docker-open5gs checkout "$DOCKER_OPEN5GS_REV"

          docker build             --build-arg OPEN5GS_VERSION="$OPEN5GS_VERSION"             --build-arg UBUNTU_VERSION="$UBUNTU_VERSION"             -t "base-open5gs:$OPEN5GS_VERSION"             /tmp/docker-open5gs/images/base-open5gs

          for nf in nrf ausf udm; do
            docker build               --build-arg OPEN5GS_VERSION="$OPEN5GS_VERSION"               --build-arg UBUNTU_VERSION="$UBUNTU_VERSION"               -t "$nf:$OPEN5GS_VERSION"               "/tmp/docker-open5gs/images/$nf"
          done

      - name: Start NRF AUSF and UDM-A
        run: |
          cd /tmp/docker-open5gs
          docker compose -f compose-files/basic/docker-compose.yaml             up -d --no-build nrf ausf udm

      - name: Start SBI packet capture
        run: |
          mkdir -p "$LAB_DIR"
          sudo tcpdump -i br-ogs -s 0 -U -w "$LAB_DIR/sbi.pcap" 'tcp port 80'             > "$LAB_DIR/tcpdump.log" 2>&1 &
          echo $! > "$LAB_DIR/tcpdump.pid"
          sleep 1

      - name: Run benign A-B-A failover
        run: |
          set -euxo pipefail
          python scripts/open5gs_failover_lab.py run --out "$LAB_DIR"

      - name: Decode routes and notifications
        if: always()
        run: |
          set +e
          if [ -f "$LAB_DIR/tcpdump.pid" ]; then
            sudo kill "$(cat "$LAB_DIR/tcpdump.pid")" 2>/dev/null
            sleep 2
          fi

          if [ -s "$LAB_DIR/sbi.pcap" ]; then
            tshark -r "$LAB_DIR/sbi.pcap"               -d tcp.port==80,http2               -Y 'http2.headers.path contains "generate-auth-data" && http2.headers.method == "POST"'               -T fields               -e frame.time_epoch -e ip.src -e ip.dst               -e http2.headers.method -e http2.headers.path               -E header=y -E separator=/t -E quote=d               > "$LAB_DIR/routes.tsv"

            tshark -r "$LAB_DIR/sbi.pcap"               -d tcp.port==80,http2               -Y 'http2.headers.path contains "nf-status-notify" && http2.headers.method == "POST"'               -T fields               -e frame.time_epoch -e ip.src -e ip.dst               -e http2.headers.method -e http2.headers.path               -E header=y -E separator=/t -E quote=d               > "$LAB_DIR/notifications.tsv"
          fi

      - name: Snapshot AUSF cache log
        run: |
          mkdir -p "$LAB_DIR/logs"
          docker cp ausf:/var/log/open5gs/ausf.log "$LAB_DIR/logs/ausf.log"

      - name: Enrich and validate real benign evidence
        run: |
          set -euxo pipefail
          pip install -e .
          python scripts/enrich_failover_observations.py             --raw "$LAB_DIR/observations-raw.csv"             --routes "$LAB_DIR/routes.tsv"             --notifications "$LAB_DIR/notifications.tsv"             --ausf-log "$LAB_DIR/logs/ausf.log"             --meta "$LAB_DIR/failover-meta.json"             --out "$LAB_DIR/observations.csv"             --counterfactual "$LAB_DIR/counterfactual-unused.csv"

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("artifacts/open5gs-benign-degradation")
          evidence = json.loads((root / "evidence-summary.json").read_text())
          obs = pd.read_csv(root / "observations.csv")
          a, b = evidence["udm_a"], evidence["udm_b"]

          assert evidence["baseline_nrf"] == [a], evidence
          assert evidence["baseline_ausf"] == [a], evidence
          assert evidence["baseline_route"] == [a], evidence
          assert evidence["failover_nrf"] == [b], evidence
          assert evidence["failover_ausf"] == [b], evidence
          assert evidence["failover_route"] == [b], evidence
          assert evidence["recovery_nrf"] == [a], evidence
          assert evidence["recovery_ausf"] == [a], evidence
          assert evidence["recovery_route"] == [a], evidence
          assert not obs["attack_active"].astype(bool).any()
          PY

      - name: Score benign telemetry degradation matrix
        run: |
          python scripts/real_telemetry_degradation.py             --observations "$LAB_DIR/observations.csv"             --out "$LAB_DIR/degradation"             --replicate-id "${{ matrix.replicate }}"             --target-fpr 0.001             --training-seeds 60             --steps 90

      - name: Upload degradation replicate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open5gs-benign-degradation-${{ matrix.replicate }}-${{ github.run_id }}
          path: artifacts/open5gs-benign-degradation/
          if-no-files-found: warn
          retention-days: 30

      - name: Tear down
        if: always()
        run: |
          docker rm -f udm-b 2>/dev/null || true
          cd /tmp/docker-open5gs
          docker compose -f compose-files/basic/docker-compose.yaml down -v || true

  aggregate:
    name: aggregate-degradation
    needs: degradation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Download degradation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: open5gs-benign-degradation-*-${{ github.run_id }}
          path: artifacts/degradation-replicates

      - name: Aggregate false-alert robustness
        run: |
          python scripts/aggregate_telemetry_degradation.py             --root artifacts/degradation-replicates             --out artifacts/open5gs-benign-degradation-summary             --requested-runs 4             --min-runs 3

      - uses: actions/upload-artifact@v4
        with:
          name: open5gs-benign-degradation-study-${{ github.run_id }}
          path: artifacts/open5gs-benign-degradation-summary/
          retention-days: 30
