name: PA-TEF benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/patef-specialized-detector
      - research/scenario-disjoint-evaluation
      - research/semantic-guard-baseline
      - research/leak-free-ablations
      - research/hard-generalization-scenarios
      - research/calibration-transfer-diagnostics
      - research/source-consensus-guard
    paths:
      - ".github/workflows/patef-benchmark.yml"
      - "src/nfnotify_lab/**"
      - "tests/test_holdout.py"
      - "tests/test_smoke.py"
      - "tests/test_hard_scenarios.py"
      - "tests/test_diagnostics.py"
      - "tests/test_consensus.py"
      - "configs/patef-benchmark.yaml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run low-FPR benchmark
        run: |
          nfnotify-lab all \
            --config configs/patef-benchmark.yaml \
            --out artifacts/patef-benchmark
      - name: Summarize PA-TEF
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          root = Path("artifacts/patef-benchmark")
          metrics = pd.read_csv(root / "metrics.csv")
          holdout = pd.read_csv(root / "scenario-holdout-summary.csv")
          calibration = pd.read_csv(root / "calibration-diagnostics.csv")
          calibration_ties = pd.read_csv(
              root / "calibration-max-score-ties.csv"
          )
          risk_register = pd.read_csv(
              root / "generalization-risk-register.csv"
          )
          patef = metrics.loc[metrics["detector"] == "patef"].iloc[0]
          patef_holdout = holdout.loc[holdout["detector"] == "patef"].iloc[0]
          semantic = metrics.loc[metrics["detector"] == "semantic_guard"].iloc[0]
          semantic_holdout = holdout.loc[
              holdout["detector"] == "semantic_guard"
          ].iloc[0]
          consensus = metrics.loc[
              metrics["detector"] == "consensus_guard"
          ].iloc[0]
          consensus_holdout = holdout.loc[
              holdout["detector"] == "consensus_guard"
          ].iloc[0]
          rules = metrics.loc[metrics["detector"] == "rules"].iloc[0]

          assert patef["fpr"] <= 0.005, patef.to_dict()
          assert patef_holdout["heldout_scenarios"] == 12, patef_holdout.to_dict()

          holdout_detail = pd.read_csv(root / "scenario-holdout.csv")
          patef_detail = holdout_detail.loc[
              holdout_detail["detector"] == "patef",
              [
                  "heldout_scenario",
                  "threshold",
                  "fpr",
                  "recall",
                  "false_positives",
                  "benign_samples",
              ],
          ]

          target_fpr = 0.001
          scenario_fpr = float(patef_holdout["unseen_scenario_fpr"])
          scenario_recall = float(patef_holdout["unseen_attack_recall"])
          semantic_scenario_fpr = float(
              semantic_holdout["unseen_scenario_fpr"]
          )
          semantic_scenario_recall = float(
              semantic_holdout["unseen_attack_recall"]
          )
          semantic_cal = calibration.loc[
              calibration["detector"] == "semantic_guard"
          ].iloc[0]
          patef_cal = calibration.loc[
              calibration["detector"] == "patef"
          ].iloc[0]
          consensus_cal = calibration.loc[
              calibration["detector"] == "consensus_guard"
          ].iloc[0]
          patef_risk = risk_register.loc[
              (risk_register["detector"] == "patef")
              & risk_register["exceeds_target_fpr"].astype(bool)
          ].copy()
          top_patef_risks = [
              {
                  "scenario": row.heldout_scenario,
                  "fpr": float(row.fpr),
                  "fpr_ratio_to_target": float(row.fpr_ratio_to_target),
              }
              for row in patef_risk.head(5).itertuples(index=False)
          ]
          semantic_ties = calibration_ties.loc[
              calibration_ties["detector"] == "semantic_guard"
          ].sort_values("max_score_ties", ascending=False)
          top_semantic_ties = [
              {
                  "scenario": row.scenario,
                  "max_score_ties": int(row.max_score_ties),
                  "share_of_all_max_score_ties": float(
                      row.share_of_all_max_score_ties
                  ),
              }
              for row in semantic_ties.head(5).itertuples(index=False)
          ]

          hypothesis = {
              "target_fpr": target_fpr,
              "run_level_recall_gain": float(
                  patef["recall_at_target_fpr"] - semantic["recall_at_target_fpr"]
              ),
              "run_level_fpr_delta": float(patef["fpr"] - semantic["fpr"]),
              "scenario_disjoint_recall_gain": float(
                  patef_holdout["unseen_attack_recall"]
                  - semantic_holdout["unseen_attack_recall"]
              ),
              "scenario_disjoint_fpr_delta": float(
                  patef_holdout["unseen_scenario_fpr"]
                  - semantic_holdout["unseen_scenario_fpr"]
              ),
              "scenario_disjoint_meets_target_fpr": bool(
                  scenario_fpr <= target_fpr
              ),
              "scenario_disjoint_strict_dominance_observed": bool(
                  scenario_recall > semantic_scenario_recall
                  and scenario_fpr <= semantic_scenario_fpr
              ),
              "scenario_disjoint_ml_advantage_at_target_fpr": bool(
                  scenario_recall > semantic_scenario_recall
                  and scenario_fpr <= target_fpr
              ),
              "consensus_guard_unseen_scenario_fpr": float(
                  consensus_holdout["unseen_scenario_fpr"]
              ),
              "consensus_guard_unseen_attack_recall": float(
                  consensus_holdout["unseen_attack_recall"]
              ),
              "consensus_guard_meets_target_fpr": bool(
                  consensus_holdout["unseen_scenario_fpr"] <= target_fpr
              ),
              "patef_recall_gain_vs_consensus_guard": float(
                  patef_holdout["unseen_attack_recall"]
                  - consensus_holdout["unseen_attack_recall"]
              ),
          }
          (root / "hypothesis-check.json").write_text(
              json.dumps(hypothesis, indent=2), encoding="utf-8"
          )

          transfer = {
              "target_fpr": target_fpr,
              "semantic_guard_calibration": {
                  "threshold": float(semantic_cal["calibration_threshold"]),
                  "benign_max_score": float(semantic_cal["benign_max_score"]),
                  "max_score_tie_count": int(
                      semantic_cal["max_score_tie_count"]
                  ),
                  "max_score_tie_rate": float(
                      semantic_cal["max_score_tie_rate"]
                  ),
                  "threshold_above_benign_max": bool(
                      semantic_cal["threshold_above_benign_max"]
                  ),
                  "top_max_score_tie_scenarios": top_semantic_ties,
              },
              "consensus_guard_calibration": {
                  "threshold": float(consensus_cal["calibration_threshold"]),
                  "benign_max_score": float(consensus_cal["benign_max_score"]),
                  "max_score_tie_count": int(
                      consensus_cal["max_score_tie_count"]
                  ),
                  "max_score_tie_rate": float(
                      consensus_cal["max_score_tie_rate"]
                  ),
                  "threshold_above_benign_max": bool(
                      consensus_cal["threshold_above_benign_max"]
                  ),
              },
              "patef_calibration": {
                  "threshold": float(patef_cal["calibration_threshold"]),
                  "benign_max_score": float(patef_cal["benign_max_score"]),
                  "max_score_tie_count": int(
                      patef_cal["max_score_tie_count"]
                  ),
                  "max_score_tie_rate": float(patef_cal["max_score_tie_rate"]),
              },
              "patef_unseen_benign_risks": top_patef_risks,
          }
          (root / "calibration-transfer.json").write_text(
              json.dumps(transfer, indent=2), encoding="utf-8"
          )

          lines = [
              "## PA-TEF hard-generalization benchmark",
              "",
              "- target FPR: 0.1%",
              f"- PA-TEF test FPR: {patef['fpr']:.6f}",
              f"- PA-TEF Recall@target-FPR: {patef['recall_at_target_fpr']:.6f}",
              f"- Semantic-guard test FPR: {semantic['fpr']:.6f}",
              (
                  "- Semantic-guard Recall@target-FPR: "
                  f"{semantic['recall_at_target_fpr']:.6f}"
              ),
              f"- Consensus-guard test FPR: {consensus['fpr']:.6f}",
              (
                  "- Consensus-guard Recall@target-FPR: "
                  f"{consensus['recall_at_target_fpr']:.6f}"
              ),
              "",
              "### Scenario-disjoint holdout",
              f"- held-out scenarios: {int(patef_holdout['heldout_scenarios'])}",
              (
                  "- PA-TEF pooled unseen-scenario FPR: "
                  f"{patef_holdout['unseen_scenario_fpr']:.6f}"
              ),
              (
                  "- PA-TEF pooled unseen-attack recall: "
                  f"{patef_holdout['unseen_attack_recall']:.6f}"
              ),
              (
                  "- semantic-guard pooled unseen-scenario FPR: "
                  f"{semantic_holdout['unseen_scenario_fpr']:.6f}"
              ),
              (
                  "- semantic-guard pooled unseen-attack recall: "
                  f"{semantic_holdout['unseen_attack_recall']:.6f}"
              ),
              (
                  "- consensus-guard pooled unseen-scenario FPR: "
                  f"{consensus_holdout['unseen_scenario_fpr']:.6f}"
              ),
              (
                  "- consensus-guard pooled unseen-attack recall: "
                  f"{consensus_holdout['unseen_attack_recall']:.6f}"
              ),
              "",
              "### ML contribution check",
              (
                  "- scenario-disjoint recall gain vs semantic guard: "
                  f"{hypothesis['scenario_disjoint_recall_gain']:.6f}"
              ),
              (
                  "- scenario-disjoint FPR delta vs semantic guard: "
                  f"{hypothesis['scenario_disjoint_fpr_delta']:.6f}"
              ),
              (
                  "- meets target FPR: "
                  f"{hypothesis['scenario_disjoint_meets_target_fpr']}"
              ),
              (
                  "- ML advantage at target FPR: "
                  f"{hypothesis['scenario_disjoint_ml_advantage_at_target_fpr']}"
              ),
              (
                  "- strict dominance vs semantic guard: "
                  f"{hypothesis['scenario_disjoint_strict_dominance_observed']}"
              ),
              (
                  "- consensus guard meets target FPR: "
                  f"{hypothesis['consensus_guard_meets_target_fpr']}"
              ),
              (
                  "- PA-TEF recall gain vs consensus guard: "
                  f"{hypothesis['patef_recall_gain_vs_consensus_guard']:.6f}"
              ),
              "",
              "### Calibration / transfer diagnostics",
              (
                  "- semantic_guard benign max-score tie rate: "
                  f"{semantic_cal['max_score_tie_rate']:.6f}"
              ),
              (
                  "- semantic_guard threshold above benign max: "
                  f"{bool(semantic_cal['threshold_above_benign_max'])}"
              ),
              (
                  "- PA-TEF unseen benign scenarios above target FPR: "
                  f"{len(patef_risk)}"
              ),
          ]
          Path("patef-summary.md").write_text("\n".join(lines), encoding="utf-8")
          print(metrics.to_string(index=False))
          print(holdout.to_string(index=False))
          print(patef_detail.to_string(index=False))
          print(calibration.to_string(index=False))
          print(semantic_ties.head(10).to_string(index=False))
          print(patef_risk.head(10).to_string(index=False))
          print(json.dumps(hypothesis, indent=2))
          print(json.dumps(transfer, indent=2))
          PY
          cat patef-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patef-benchmark-${{ github.run_id }}
          path: artifacts/patef-benchmark/
          retention-days: 30
