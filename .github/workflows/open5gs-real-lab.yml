name: Open5GS real lab observations

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lab/open5gs-real-observations
      - research/patef-specialized-detector
      - research/scenario-disjoint-evaluation
      - research/external-control-candidate
    paths:
      - ".github/workflows/open5gs-real-lab.yml"
      - "scripts/open5gs_real_lab.py"
      - "scripts/enrich_real_notifications.py"
      - "docs/real-open5gs-actions.md"
      - "docs/patef-detector.md"
      - "src/nfnotify_lab/**"
      - "configs/experiment.yaml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  real-open5gs-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPEN5GS_VERSION: v2.7.7
      UBUNTU_VERSION: jammy
      MONGODB_VERSION: "8.0"
      DOCKER_HOST_IP: 127.0.0.1
      DOCKER_OPEN5GS_REV: 10295cfecb2f86f88944df1728127853eb4d6a1f
      LAB_DIR: artifacts/open5gs-real

    steps:
      - name: Checkout detector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump tshark jq

      - name: Build Open5GS v2.7.7 laboratory images
        run: |
          set -euxo pipefail
          git clone https://github.com/Borjis131/docker-open5gs.git /tmp/docker-open5gs
          git -C /tmp/docker-open5gs checkout "$DOCKER_OPEN5GS_REV"

          docker build             --build-arg OPEN5GS_VERSION="$OPEN5GS_VERSION"             --build-arg UBUNTU_VERSION="$UBUNTU_VERSION"             -t "base-open5gs:$OPEN5GS_VERSION"             /tmp/docker-open5gs/images/base-open5gs

          for nf in nrf ausf udm; do
            docker build               --build-arg OPEN5GS_VERSION="$OPEN5GS_VERSION"               --build-arg UBUNTU_VERSION="$UBUNTU_VERSION"               -t "$nf:$OPEN5GS_VERSION"               "/tmp/docker-open5gs/images/$nf"
          done

      - name: Start isolated NRF AUSF UDM core
        run: |
          set -euxo pipefail
          cd /tmp/docker-open5gs
          docker compose -f compose-files/basic/docker-compose.yaml             up -d --no-build nrf ausf udm
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker network inspect open5gs > "$GITHUB_WORKSPACE/open5gs-network.json"

      - name: Start SBI packet capture
        run: |
          set -euxo pipefail
          mkdir -p "$LAB_DIR"
          sudo tcpdump -i br-ogs -s 0 -U -w "$LAB_DIR/sbi.pcap" 'tcp port 80'             > "$LAB_DIR/tcpdump.log" 2>&1 &
          echo $! > "$LAB_DIR/tcpdump.pid"
          sleep 1

      - name: Run legitimate UDM recovery experiment
        run: |
          set -euxo pipefail
          python scripts/open5gs_real_lab.py run --out "$LAB_DIR"

      - name: Stop capture and decode HTTP2 notifications
        if: always()
        run: |
          set +e
          if [ -f "$LAB_DIR/tcpdump.pid" ]; then
            sudo kill "$(cat "$LAB_DIR/tcpdump.pid")" 2>/dev/null
            sleep 2
          fi

          if [ -s "$LAB_DIR/sbi.pcap" ]; then
            tshark -r "$LAB_DIR/sbi.pcap"               -d tcp.port==80,http2               -Y 'http2.headers.path contains "nf-status-notify"'               -T fields               -e frame.time_epoch               -e ip.src               -e ip.dst               -e http2.headers.method               -e http2.headers.path               -E header=y -E separator=/t -E quote=d               > "$LAB_DIR/nfstatusnotify.tsv"

            tshark -r "$LAB_DIR/sbi.pcap"               -d tcp.port==80,http2               -Y 'http2.headers.method'               -T fields               -e frame.time_epoch               -e ip.src               -e ip.dst               -e http2.headers.method               -e http2.headers.path               -E header=y -E separator=/t -E quote=d               > "$LAB_DIR/http2-requests.tsv"
          fi

      - name: Collect Open5GS logs
        if: always()
        run: |
          set +e
          mkdir -p "$LAB_DIR/logs"
          for nf in nrf ausf udm; do
            docker logs "$nf" > "$LAB_DIR/logs/$nf-docker.log" 2>&1
            docker cp "$nf:/var/log/open5gs/$nf.log" "$LAB_DIR/logs/$nf.log" 2>/dev/null
          done
          grep -E '\(NRF-notify\)|Subscription created|NF_DEREGISTERED'             "$LAB_DIR/logs/ausf.log" "$LAB_DIR/logs/nrf.log"             > "$LAB_DIR/semantic-evidence.log" 2>/dev/null || true
          cp open5gs-network.json "$LAB_DIR/" 2>/dev/null || true

      - name: Enrich observations and build detector features
        run: |
          set -euxo pipefail
          python scripts/enrich_real_notifications.py             --observations "$LAB_DIR/observations.csv"             --notifications "$LAB_DIR/nfstatusnotify.tsv"             --meta "$LAB_DIR/lab-meta.json"

          python -m pip install -e .
          nfnotify-lab ingest             --observations "$LAB_DIR/observations.csv"             --out "$LAB_DIR/derived"
          nfnotify-lab score-control             --config configs/experiment.yaml             --out "$LAB_DIR/derived"             --detector semantic_guard
          nfnotify-lab score-control             --config configs/experiment.yaml             --out "$LAB_DIR/derived"             --detector patef

      - name: Validate real NFStatusNotify evidence
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/open5gs-real")
          summary = json.loads((root / "notification-summary.json").read_text())
          assert summary["notification_frames"] >= 1, summary
          assert summary["trusted_nrf_to_ausf_frames"] >= 1, summary

          semantic = (root / "semantic-evidence.log").read_text(errors="replace")
          assert "(NRF-notify)" in semantic, semantic

          candidate = json.loads(
              (
                  root
                  / "derived"
                  / "control-summary-semantic_guard.json"
              ).read_text()
          )
          patef = json.loads(
              (root / "derived" / "control-summary-patef.json").read_text()
          )
          assert candidate["alerts"] == 0, candidate
          assert patef["alerts"] == 0, patef

          print(json.dumps(summary, indent=2))
          print(json.dumps(candidate, indent=2))
          print(json.dumps(patef, indent=2))
          with open(Path.cwd() / "lab-summary.md", "w", encoding="utf-8") as f:
              f.write("## Open5GS real lab\n\n")
              f.write(f"- NFStatusNotify frames: {summary['notification_frames']}\n")
              f.write(
                  "- Trusted NRF → AUSF frames: "
                  f"{summary['trusted_nrf_to_ausf_frames']}\n"
              )
              f.write("- Scenario: legitimate UDM stop/restart (no forged payload)\n")
              f.write(
                  "- semantic_guard benign-control alerts: "
                  f"{candidate['alerts']}\n"
              )
              f.write(
                  "- PA-TEF benign-control alerts: "
                  f"{patef['alerts']}\n"
              )
          PY
          cat lab-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload laboratory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open5gs-real-observations-${{ github.run_id }}
          path: artifacts/open5gs-real/
          if-no-files-found: warn
          retention-days: 30

      - name: Tear down laboratory
        if: always()
        run: |
          cd /tmp/docker-open5gs
          docker compose -f compose-files/basic/docker-compose.yaml down -v || true
